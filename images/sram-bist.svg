<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360">
<style>text{font-family:'JetBrains Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace;font-size:14px;}</style>
<rect width="840" height="360" fill="#0b1226"/>
<rect width="840" height="30" fill="#101a33"/>
<line x1="0" y1="30" x2="840" y2="30" stroke="#26355c"/>
<circle cx="18" cy="15" r="5" fill="#ff5f57"/><circle cx="36" cy="15" r="5" fill="#febc2e"/><circle cx="54" cy="15" r="5" fill="#28c840"/>
<text x="68" y="19" fill="#8b96b8" font-size="12">sram_BIST.sv  —  SystemVerilog</text>
<text x="38" y="55" fill="#44507a" text-anchor="end"> 1</text>
<text x="52" y="55" fill="#6b7a9e" text-anchor="start" font-style="italic"> </text>
<text x="38" y="75" fill="#44507a" text-anchor="end"> 2</text>
<text x="52" y="75" fill="#6b7a9e" text-anchor="start" font-style="italic">/*</text>
<text x="38" y="95" fill="#44507a" text-anchor="end"> 3</text>
<text x="52" y="95" fill="#6b7a9e" text-anchor="start" font-style="italic"> * SRAM Built-In Self-Test (BIST)</text>
<text x="38" y="115" fill="#44507a" text-anchor="end"> 4</text>
<text x="52" y="115" fill="#6b7a9e" text-anchor="start" font-style="italic"> * Seher Mian &amp; Huzaim Malik</text>
<text x="38" y="135" fill="#44507a" text-anchor="end"> 5</text>
<text x="52" y="135" fill="#6b7a9e" text-anchor="start" font-style="italic"> * October 8, 2026</text>
<text x="38" y="155" fill="#44507a" text-anchor="end"> 6</text>
<text x="52" y="155" fill="#6b7a9e" text-anchor="start" font-style="italic"> *</text>
<text x="38" y="175" fill="#44507a" text-anchor="end"> 7</text>
<text x="52" y="175" fill="#6b7a9e" text-anchor="start" font-style="italic"> * Description:</text>
<text x="38" y="195" fill="#44507a" text-anchor="end"> 8</text>
<text x="52" y="195" fill="#6b7a9e" text-anchor="start" font-style="italic"> *   Tests a 16-bit SRAM with an 18-bit address bus using two</text>
<text x="38" y="215" fill="#44507a" text-anchor="end"> 9</text>
<text x="52" y="215" fill="#6b7a9e" text-anchor="start" font-style="italic"> *   address-dependent XOR test patterns.</text>
<text x="38" y="235" fill="#44507a" text-anchor="end">10</text>
<text x="52" y="235" fill="#6b7a9e" text-anchor="start" font-style="italic"> *</text>
<text x="38" y="255" fill="#44507a" text-anchor="end">11</text>
<text x="52" y="255" fill="#6b7a9e" text-anchor="start" font-style="italic"> *   Test sequence:</text>
<text x="38" y="275" fill="#44507a" text-anchor="end">12</text>
<text x="52" y="275" fill="#6b7a9e" text-anchor="start" font-style="italic"> *     1. Write even addresses in ascending order.</text>
<text x="38" y="295" fill="#44507a" text-anchor="end">13</text>
<text x="52" y="295" fill="#6b7a9e" text-anchor="start" font-style="italic"> *     2. Read and verify even addresses in descending order.</text>
<text x="38" y="315" fill="#44507a" text-anchor="end">14</text>
<text x="52" y="315" fill="#6b7a9e" text-anchor="start" font-style="italic"> *     3. Write odd addresses in ascending order.</text>
<text x="38" y="335" fill="#44507a" text-anchor="end">15</text>
<text x="52" y="335" fill="#6b7a9e" text-anchor="start" font-style="italic"> *     4. Read and verify odd addresses in descending order.</text>
<text x="38" y="355" fill="#44507a" text-anchor="end">16</text>
<text x="52" y="355" fill="#6b7a9e" text-anchor="start" font-style="italic"> *     5. Wait for outstanding reads and signal completion.</text>
</svg>